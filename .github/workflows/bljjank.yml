name: Beny NG Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -------------------------
      # Java
      # -------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -------------------------
      # Android SDK
      # -------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools"

      # -------------------------
      # Check SDK
      # -------------------------
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      # -------------------------
      # Find Gradle
      # -------------------------
      - name: Find Gradle wrapper
        run: |
          echo "Searching for gradlew..."
          find . -maxdepth 5 -name gradlew -type f -print

      # -------------------------
      # Gradle
      # -------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -------------------------
      # Build
      # -------------------------
      - name: Build APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # -------------------------
      # Upload APK
      # -------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BenyNG-apk
          path: "V2rayNG/**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
