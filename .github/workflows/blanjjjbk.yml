name: Beny NG Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Find Gradle
        run: |
          echo "Searching for gradlew..."
          find . -type f -name "gradlew" -print

      - name: Build APK
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found!"
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BenyNG-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
